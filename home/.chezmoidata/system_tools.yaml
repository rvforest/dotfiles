# Keep the capture markers below; the install-time helper uses them as stable
# insertion points without reformatting this file.
homebrew:
  formulas:
    # Essential CLI tools that this repo expects everywhere Homebrew is used.
    core:
      - bat # improved cat
      - coreutils # GNU core utilities
      - delta # improved diff
      - direnv # directory env vars
      - duf # disk free. df alternative
      - dust # du alternative
      - eza # improved ls
      - fd # improved find
      - fnm  # nvm alternative
      - fx # json viewer
      - fzf # fuzzy matching
      - gh # GitHub CLI
      - gum # tool for making interactive shell scripts
      - hyperfine # cli benchmarking
      - jq # JSON processor
      - lazygit # git tui
      - keychain # enables one ssh-agent per system
      - neovim # Modern vim
      - nushell # Cross-platform data first shell
      - procs # ps replacement
      - ripgrep # Fast text/code search
      - sd # sed alternative
      - shellcheck # Shell script linter
      - shfmt # Shell script formatter
      - starship # Shell prompt
      - tealdeer # fast tldr replacement
      - uv # Python package manager
      - vim  # text editor
      - yq # like jq for yaml
      - zoxide # a smarter cd command
      - lazysql
      # dotfiles-tool-capture: homebrew-formulas-core

    # Heavier development tools for non-mobile machines.
    desktop:
      - act # run github actions locally
      - actionlint # lint github actions
      - ast-grep # CLI tool for code structural search
      - atuin # shell history (can be resource intensive)
      - bat-extras # Extensions for bat (diff, grep, man, etc)
      - btop # improved top (resource monitoring)
      - copier # Project templating tool
      - difftastic # Structural diff tool for code
      - docker # Docker command-line client
      - docker-compose # Orchestrate multi-container Docker applications
      - duckdb # Analytical DB for local files
      - jd # JSON diff
      - jnv # Interactive JSON filter using jq
      - rust # Rust language
      - yamllint # yaml linter
      - yamlfmt # yaml formatter
      - yazi # file browser
      - yj # Convert between YAML, TOML, JSON, and HCL
      - zellij # terminal workspace manager
      - usage # usage CLI tool
      # dotfiles-tool-capture: homebrew-formulas-desktop

  casks:
    # GUI applications and special packages for desktop-like environments.
    desktop:
      # dotfiles-tool-capture: homebrew-casks-desktop

uv:
  # These are PEP 508 package requirements understood by `uv tool install`.
  # Installs that need additional CLI options remain machine-local.
  tools:
    # Existing tools remain available everywhere, including mobile machines.
    core:
      - copier
      - httpie
      - langgraph-cli
      - llm
      - nox
      - pre-commit
      - watchgha
      - harlequin
      - specify-cli
      # dotfiles-tool-capture: uv-tools-core

    # Install-time capture defaults new tools to this non-mobile scope.
    desktop:
      # dotfiles-tool-capture: uv-tools-desktop

llm:
  plugins:
    - llm-cmd
    - llm-openrouter
